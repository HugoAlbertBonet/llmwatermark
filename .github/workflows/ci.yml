name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: core tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Into a virtualenv, not --system: the runner's system Python is PEP 668
      # externally managed, which uv refuses outright. --python is also what makes the
      # matrix real - without it every row would silently test the same interpreter.
      - name: Install the package and its dev tooling
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      # Backend-marked tests stay skipped: CI has no accelerators.
      - name: Core tests
        run: .venv/bin/pytest

  torch-agreement:
    name: numpy and torch produce identical greenlists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the package, dev tooling and CPU-only torch
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      # The cross-backend promise rests on these being bit-identical.
      - name: Greenlist agreement tests
        run: .venv/bin/pytest --backend torch tests/test_greenlist.py

  transformers-adapter:
    name: transformers adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the package with CPU-only torch and transformers
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install transformers

      # Models are built from a config, never downloaded, so this needs no network.
      # The Unsloth file is here for its stand-in test, which reproduces Unsloth's
      # generate repatching without needing Unsloth or a GPU; that guard is the reason
      # the transformers adapter is safe under Unsloth, so it must run somewhere.
      - name: Adapter tests
        run: |
          .venv/bin/pytest --backend transformers \
            tests/test_adapter_transformers.py tests/test_adapter_unsloth.py

  # The vLLM adapter's row bookkeeping runs in the core suite above; the engine tests
  # themselves need a GPU and are marked requires_vllm, so they stay skipped here.

  quality:
    name: lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the package and its dev tooling
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Format check
        run: .venv/bin/ruff format --check .

      # Deliberately with no backend installed. mypy's answer depends on what is present,
      # so the quality job pins one environment and the code type-checks in it.
      - name: Type-check
        run: .venv/bin/mypy

      # The README is verified rather than asserted: its snippets must parse and the
      # symbols they import must exist.
      - name: README and examples
        run: .venv/bin/pytest tests/test_readme.py

  dependency-policy:
    name: core install pulls numpy only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the core package with no extras
        run: |
          uv venv --python 3.12
          uv pip install .

      - name: Assert no backend or plotting dependency was installed
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util, sys
          forbidden = ["torch", "transformers", "vllm", "matplotlib"]
          found = [m for m in forbidden if importlib.util.find_spec(m) is not None]
          if found:
              sys.exit(f"core install pulled forbidden dependencies: {found}")
          import llmwatermark
          print("core import OK:", llmwatermark.__version__)
          PY
