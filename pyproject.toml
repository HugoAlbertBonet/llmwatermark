[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "llmwatermark"
dynamic = ["version"]
description = "Plug-and-play KGW-style watermarking and detection for language models."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Hugo Albert Bonet", email = "hugo.albert.16@gmail.com" }]
keywords = ["watermark", "llm", "kgw", "detection", "provenance", "text-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# The core package and the detector depend on numpy only. Every inference
# backend is an optional extra, so installing this tool never pulls torch or
# eight inference stacks. See "Dependency policy" in AGENTS.md.
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
transformers = ["transformers>=4.40", "torch>=2.1"]
vllm = ["vllm>=0.8"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/HugoAlbertBonet/llmwatermark"
Repository = "https://github.com/HugoAlbertBonet/llmwatermark"
Issues = "https://github.com/HugoAlbertBonet/llmwatermark/issues"

# Single source of truth for the version: __version__ in the package itself.
[tool.hatch.version]
path = "src/llmwatermark/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/llmwatermark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = [
    "error",
    # torch's own internals raise deprecation warnings while tracing under
    # torch.compile. They are not ours to fix, and escalating them to errors would make
    # compilation look like it failed.
    "ignore::DeprecationWarning:torch",
    "ignore::DeprecationWarning:torch.*",
    "ignore::FutureWarning:torch",
    "ignore::FutureWarning:torch.*",
    # torch.cuda.set_sync_debug_mode warns that it is a prototype every time it is called,
    # including when the sync-debug tests reset it.
    "ignore:Synchronization debug mode is a prototype feature:UserWarning",
]
markers = [
    "requires_torch: needs torch installed (CPU is enough)",
    "requires_cuda: needs a CUDA GPU and a CUDA-enabled torch build",
    "requires_transformers: needs the transformers backend installed",
    "requires_vllm: needs the vLLM backend installed (GPU)",
    "requires_llama_cpp: needs llama-cpp-python installed",
    "requires_mlx_lm: needs mlx-lm installed (Apple silicon)",
    "requires_exllamav2: needs ExLlamaV2 installed (NVIDIA GPU)",
    "requires_exllamav3: needs ExLlamaV3 installed (NVIDIA GPU)",
    "requires_sglang: needs SGLang installed (GPU)",
    "requires_trtllm: needs TensorRT-LLM installed (NVIDIA GPU)",
    "requires_lmdeploy: needs LMDeploy installed (GPU)",
    "requires_viz: needs the [viz] extra (matplotlib) installed",
    "benchmark: performance measurement, not a correctness check",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# No python_version pin: numpy's shipped stubs use 3.12 syntax, which mypy refuses to
# parse when told to target 3.10. Runtime 3.10 compatibility is enforced by the test
# matrix, which actually imports and runs the package on 3.10.
files = ["src"]
strict = true
warn_unreachable = true

# Backend libraries are optional extras, imported lazily inside the adapters that need
# them. The quality job installs none of them, so their absence must not be an error.
[[tool.mypy.overrides]]
module = ["numpy.*", "torch.*", "transformers.*"]
ignore_missing_imports = true
